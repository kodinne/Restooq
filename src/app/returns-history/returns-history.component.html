<div class="page">
  <header class="page-header">
    <div class="title">Histórico de Devoluções</div>
    <button class="btn" (click)="load()">Atualizar</button>
  </header>

  <div class="panel">
    <table class="table">
      <thead>
        <tr>
          <th>ID</th><th>Pedido</th><th>Produto</th><th>Qtd</th><th>Valor</th><th>Motivo</th><th>Data</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of items">
          <td>#{{ r.id }}</td>
          <td>#{{ r.orderId }}</td>
          <td>#{{ r.productId }}</td>
          <td>{{ r.quantity }}</td>
          <td>{{ r.value | currency:'BRL' }}</td>
          <td>{{ r.reason }}</td>
          <td>{{ r.date | date:'dd/MM/yyyy HH:mm' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
