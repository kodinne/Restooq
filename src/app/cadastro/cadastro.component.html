<app-public-header></app-public-header>
<div class="auth">
  <div class="illustration"></div>
  <div class="form-card">
    <h2><i class="bi bi-person-plus"></i> Criar conta</h2>
    <p class="subtitle">Gerencie seu inventÃ¡rio com eficiÃªncia</p>

    <form [formGroup]="cadastroForm" (ngSubmit)="onSubmit()" class="grid">
      <label>Nome completo<input formControlName="nome" placeholder="Digite seu nome" /></label>
      <label>Email<input type="email" formControlName="email" placeholder="Digite seu email" /></label>
      <label>Senha<input type="password" formControlName="senha" placeholder="Mínimo 6 caracteres" /></label>
      <label>Confirmar senha<input type="password" formControlName="confirmarSenha" placeholder="Repita a senha" /></label>
      <div class="actions"><button class="btn primary" [disabled]="cadastroForm.invalid">Cadastrar</button></div>
    </form>

    <p class="alt">Já tem uma conta? <a routerLink="/login">Entrar</a></p>
  </div>
</div>
